# Render blueprint for the Voxora API.
# The frontend is deployed separately on Vercel from the client/ directory.
services:
  - type: web
    name: voxora-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TTS_PROVIDER
        value: edge
      # Set these in the Render dashboard; never commit them.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Object storage. Without these, audio is written to the instance's
      # ephemeral disk and is lost on every restart and redeploy.
      - key: S3_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
